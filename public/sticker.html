<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine House — Register QR sticker</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/sticker.js" defer></script>
</head>
<body class="sticker-page">
  <main>
    <div class="print-sign">
      <p class="sign-brand">Engine House Coffee</p>
      <p class="sign-title">Scan for your daily stamp</p>
      <img class="qr qr-large" src="/api/staff/register-qr.svg" alt="Register QR code" width="420" height="420">
      <p class="sign-foot">Scan with your phone camera or the Engine House app<br><strong>One stamp a day · 8th visit is free</strong></p>
    </div>
    <div class="sticker-actions">
      <button class="btn btn-primary" id="print">🖨 Print</button>
      <a class="btn" href="/api/staff/register-qr.png" download>⬇ QR image (PNG)</a>
      <a class="btn btn-ghost" href="/">Back</a>
    </div>
  </main>
</body>
</html>
